# Local services for development (decision D-022):
#   mongo    MongoDB 8.0 as a one-node replica set (transactions need a replica set). URI in .env.example.
#   mailpit  catches outgoing email; inbox at http://localhost:8025, SMTP on localhost:1025.
# Start with `docker compose up -d`, stop with `docker compose down` (data stays in the mongo-data volume).
services:
  mongo:
    image: mongo:8.0.34
    command: ['--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Initiates the replica set on first start, then reports healthy once it has a primary.
      test:
        [
          'CMD',
          'mongosh',
          '--quiet',
          '--eval',
          "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }).ok }",
        ]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 5s

  mailpit:
    image: axllent/mailpit:v1.33.0
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  mongo-data:
