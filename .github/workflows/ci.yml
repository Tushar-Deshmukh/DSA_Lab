# Lint, type check, unit and integration tests, the legacy suite, and end-to-end tests (plan §13.3).
# Chromium on every push; Firefox and WebKit as well in the nightly run and on manual runs.
name: CI

on:
  push:
    branches: [main, 'phase-*']
  pull_request:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Runners are pinned to Ubuntu 24.04: ubuntu-latest is moving to Ubuntu 26, and the MongoDB 8.0 test binary
# (mongodb-memory-server) has to exist for the runner's distribution.
env:
  NEXT_TELEMETRY_DISABLED: '1'
  # mongodb-memory-server keeps its MongoDB binary here, so the cache step below can reuse it.
  MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/.cache/mongodb-binaries

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:deps
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/mongodb-binaries
          key: mongodb-8.0.34-${{ runner.os }}
      - run: npm test

  legacy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run legacy:test

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/mongodb-binaries
          key: mongodb-8.0.34-${{ runner.os }}
      - name: Install browsers
        run: npx playwright install --with-deps ${{ (github.event_name == 'push' || github.event_name == 'pull_request') && 'chromium' || 'chromium firefox webkit' }}
      - run: npm run build:e2e
      - name: End-to-end tests
        run: npx playwright test ${{ (github.event_name == 'push' || github.event_name == 'pull_request') && '--project=chromium' || '' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
