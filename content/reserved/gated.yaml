  - id: classification-drill-answers
    by: classification-drill
    md: '*Answers:* 1 boundary binary search on a rotated array; 2 variable sliding window with a count map; 3 intervals: sort + min-heap of end times (or sweep); 4 backtracking with pruning sets; 5 trie; 6 prefix sums with remainders in a hash map; 7 topological sort (Kahn); 8 unbounded-knapsack DP; 9 monotonic stack; 10 BFS on a grid; 11 Dijkstra; 12 max-heap of size k keyed by squared distance (or quickselect); 13 fast/slow pointers; 14 level-order BFS (last node per level); 15 two heaps.'
