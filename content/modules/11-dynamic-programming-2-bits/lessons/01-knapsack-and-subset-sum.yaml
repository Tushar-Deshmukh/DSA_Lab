exercises:
  - id: ex-01
    legacyId: w11d1-1
    type: trace
    tag: The 416 table by hand
    q: 416 on `[1, 5, 11, 5]` (target 11), iterating downwards. List reachable sums as comma-separated numbers.
    rows:
      - prompt: Reachable sums after the first two items (1 and 5)
        answer: 0,1,5,6
      - prompt: Reachable sums after all four items
        answer: 0,1,5,6,10,11
      - prompt: The answer
        answer: 'true'
    verify: |
      const t = 11, run = (items) => { const dp = new Array(t + 1).fill(false); dp[0] = true; for (const x of items) for (let j = t; j >= x; j--) if (dp[j - x]) dp[j] = true; return dp; };
      const show = (dp) => dp.map((b, j) => (b ? j : -1)).filter((j) => j >= 0).join(',');
      console.log(show(run([1, 5]))); console.log(show(run([1, 5, 11, 5]))); console.log(run([1, 5, 11, 5])[11]);
    explain: '{11} and {1, 5, 5} both sum to 11.'
    hints:
      - After each item, the new reachable sums are the old ones plus the old ones shifted by x.
  - id: ex-02
    legacyId: w11d1-2
    type: predict
    tag: Reproduce the reuse bug
    q: What does this print? (It iterates j upwards.)
    code: |
      const nums = [3], target = 6;
      const dp = new Array(target + 1).fill(false); dp[0] = true;
      for (const x of nums) for (let j = x; j <= target; j++) if (dp[j - x]) dp[j] = true;
      console.log(dp[6]);
    answer: 'true'
    normalize: exact
    traps:
      'false': 'That is what the correct (downward) loop prints. Upwards, dp[3] is set from dp[0], then dp[6] from the freshly set dp[3]: the single 3 is used twice.'
    explain: One item of size 3 cannot make 6. The upward loop says it can, which is exactly the unbounded knapsack from Module 10.
    hints:
      - Which cell does dp[6] read, and when was that cell set?
  - id: ex-03
    legacyId: w11d1-3
    type: fill
    tag: Partition Equal Subset Sum (416)
    q: Complete `canPartition(nums)`.
    template: |
      function canPartition(nums) {
        const total = nums.reduce((a, b) => a + b, 0);
        if ([[0]]) return false;
        const target = total / 2, dp = new Array(target + 1).fill(false);
        dp[0] = true;
        for (const x of nums)
          for (let j = target; [[1]]; j--)
            if (dp[j - x]) dp[j] = true;
        return dp[target];
      }
    blanks:
      - accept:
          - total % 2
          - total % 2 !== 0
          - total % 2 === 1
          - total % 2 != 0
          - total % 2 == 1
      - accept:
          - j >= x
          - x <= j
    fn: canPartition
    tests:
      - args:
          - - 1
            - 5
            - 11
            - 5
        expect: true
      - args:
          - - 1
            - 2
            - 3
            - 5
        expect: false
      - args:
          - - 2
            - 2
        expect: true
      - args:
          - - 1
        expect: false
      - args:
          - - 3
            - 3
            - 3
            - 4
            - 5
        expect: true
    explain: Stopping at j ≥ x avoids negative indices; cells below x cannot use this item anyway.
    hints:
      - When is an equal split impossible before any table?
      - Where does the downward loop stop?
  - id: ex-04
    legacyId: w11d1-4
    type: mcq
    tag: Derive the transformation
    q: '494: put + or − before each number so the sum is `target`. Let P be the sum of the + numbers and N the sum of the − numbers. Which count equals the answer?'
    options:
      - t: The number of subsets summing to P = (total + target) / 2
        ok: true
        why: P − N = target and P + N = total, so 2P = total + target.
      - t: The number of subsets summing to target
        why: 'That ignores the minus signs: the other numbers are subtracted, not dropped.'
        kind: concept
      - t: The number of subsets summing to total − target
        why: Adding the two equations gives 2P = total + target, not P = total − target.
        kind: concept
    explain: If total + target is odd, or |target| > total, the answer is 0. Zeros double the count (+0 and −0 are different assignments), which the subset count handles automatically.
    hints:
      - Write two equations in P and N.
  - id: ex-05
    legacyId: w11d1-5
    type: code
    tag: Count subsets with a given sum
    q: 'Write `countSubsets(nums, target)`: the number of subsets (by index, so equal values in different positions are different) whose sum is `target`. Values are non-negative.'
    fn: countSubsets
    starter: |
      function countSubsets(nums, target) {

      }
    solution: |
      function countSubsets(nums, target) {
        const dp = new Array(target + 1).fill(0); dp[0] = 1;
        for (const x of nums) for (let j = target; j >= x; j--) dp[j] += dp[j - x];
        return dp[target];
      }
    tests:
      - args:
          - - 1
            - 1
            - 1
            - 1
            - 1
          - 3
        expect: 10
      - args:
          - - 1
            - 2
            - 3
          - 3
        expect: 2
      - args:
          - - 2
            - 2
          - 2
        expect: 2
      - args:
          - - 1
          - 2
        expect: 0
        hidden: true
      - args:
          - - 0
            - 0
            - 1
          - 1
        expect: 4
        hidden: true
    explain: Feasibility used `||`; counting uses `+=` with the same downward loop. With target = (total + target) / 2 this solves 494.
    hints:
      - 'dp[0] = 1: the empty subset.'
      - Same loop as 416, with `+=` instead of `= true`.
      - Does a 0 item double the count? Check the loop with x = 0.
  - id: ex-06
    legacyId: w11d1-6
    type: interview
    title: Ones and Zeroes (LeetCode 474)
    q: '`strs` is a list of binary strings. Return the size of the largest subset of `strs` with at most `m` zeros and `n` ones in total. Example: `["10","0001","111001","1","0"]`, m = 5, n = 3 → 4.'
    model:
      clarify: |
        - Each string is used at most once.
        - Up to 600 strings; m, n ≤ 100.
      brute: 'All 2ᵏ subsets of k strings: hopeless for k = 600.'
      optimize: |
        0/1 knapsack with **two** capacities. State: `dp[i][j]` = the most strings using at most i zeros and j ones, over the strings processed so far. For each string with z zeros and o ones, iterate i from m down to z and j from n down to o: `dp[i][j] = max(dp[i][j], dp[i − z][j − o] + 1)`. Both loops go downwards for the same reason as in 416.
      edges: |
        - a string that alone exceeds m or n → never taken
        - m = 0 or n = 0
        - all strings fit
      complexity: O(k · m · n) time, O(m · n) space.
    fn: findMaxForm
    starter: |
      function findMaxForm(strs, m, n) {

      }
    solution: |
      function findMaxForm(strs, m, n) {
        const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
        for (const s of strs) {
          let z = 0; for (const ch of s) if (ch === '0') z++;
          const o = s.length - z;
          for (let i = m; i >= z; i--) for (let j = n; j >= o; j--) dp[i][j] = Math.max(dp[i][j], dp[i - z][j - o] + 1);
        }
        return dp[m][n];
      }
    tests:
      - args:
          - - '10'
            - '0001'
            - '111001'
            - '1'
            - '0'
          - 5
          - 3
        expect: 4
      - args:
          - - '10'
            - '0'
            - '1'
          - 1
          - 1
        expect: 2
      - args:
          - - '111'
          - 1
          - 1
        expect: 0
        hidden: true
      - args:
          - - '0'
            - '0'
            - '1'
            - '1'
          - 2
          - 2
        expect: 4
        hidden: true
      - args:
          - - '10'
            - '0001'
            - '111001'
            - '1'
            - '0'
          - 3
          - 4
        expect: 3
        hidden: true
    explain: The item is a string; its "weight" has two dimensions; the value is 1. Everything else is 416.
    hints:
      - What are the item, the weight and the value?
      - Two capacities → a 2-D table over (zeros, ones).
      - Which direction must both loops go?
