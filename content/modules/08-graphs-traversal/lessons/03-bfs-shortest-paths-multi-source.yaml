    explain: Phase 1 is Number of Islands; phase 2 is Rotting Oranges with a whole island as the source. Combining two known patterns is what this problem tests.
    hints:
      - Which earlier problem finds all cells of one island?
      - Which earlier problem spreads outwards from many sources at once?
      - Count BFS layers until you touch the other island.
