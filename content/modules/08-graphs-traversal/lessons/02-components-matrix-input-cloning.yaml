exercises:
  - id: ex-01
    legacyId: w8d2-1
    type: code
    tag: Count components
    q: 'Write `countComponents(n, edges)`: the number of connected components of an undirected graph with nodes 0..n−1. Isolated nodes count.'
    fn: countComponents
    starter: |
      function countComponents(n, edges) {

      }
    solution: |
      function countComponents(n, edges) {
        const adj = Array.from({ length: n }, () => []);
        for (const [u, v] of edges) { adj[u].push(v); adj[v].push(u); }
        const seen = new Array(n).fill(false);
        let count = 0;
        for (let s = 0; s < n; s++) {
          if (seen[s]) continue;
          count++; seen[s] = true;
          const st = [s];
          while (st.length) {
            const u = st.pop();
            for (const v of adj[u]) if (!seen[v]) { seen[v] = true; st.push(v); }
          }
        }
        return count;
      }
    tests:
      - args:
          - 5
          - - - 0
              - 1
            - - 1
              - 2
            - - 3
              - 4
        expect: 2
      - args:
          - 5
          - - - 0
              - 1
            - - 1
              - 2
            - - 2
              - 3
            - - 3
              - 4
        expect: 1
      - args:
          - 4
          - []
        expect: 4
      - args:
          - 3
          - - - 0
              - 0
        expect: 3
        hidden: true
      - args:
          - 6
          - - - 5
              - 4
            - - 4
              - 3
            - - 0
              - 2
        expect: 3
        hidden: true
    explain: The outer loop is what counts isolated nodes and every other component.
    hints:
      - Build the adjacency list with both directions.
      - Loop over every node; each unvisited one starts a new component.
  - id: ex-02
    legacyId: w8d2-2
    type: predict
    tag: Matrix input
    q: Problem 547 gives `isConnected`, an adjacency matrix. What does this print?
    code: |
      const isConnected = [[1, 1, 0], [1, 1, 0], [0, 0, 1]];
      const seen = new Array(3).fill(false);
      let provinces = 0;
      function dfs(i) {
        seen[i] = true;
        for (let j = 0; j < 3; j++) if (isConnected[i][j] === 1 && !seen[j]) dfs(j);
      }
      for (let i = 0; i < 3; i++) if (!seen[i]) { provinces++; dfs(i); }
      console.log(provinces);
    answer: '2'
    traps:
      '1': City 2 has no connection to the others.
      '3': Cities 0 and 1 are connected (isConnected[0][1] = 1), so they form one province; city 2 is alone.
    explain: 'With a matrix, the neighbours of i are the columns j with a 1: iterating them costs O(n) per node, O(n²) total, which is the size of the input anyway.'
    hints:
      - Which cities does city 0 reach?
  - id: ex-03
    legacyId: w8d2-3
    type: mcq
    tag: The map's two jobs
    q: In Clone Graph, why is a separate `visited` set unnecessary?
    options:
      - t: A node has been visited exactly when it already has an entry in the original → copy map.
        ok: true
        why: The map's keys are the visited set; its values are the copies needed for wiring.
      - t: Because the graph has no cycles.
        why: It can have cycles (1–2–3–1); the map is what prevents infinite loops.
        kind: concept
      - t: Because node values are unique.
        why: Values being unique does not stop a traversal from revisiting nodes.
        kind: concept
    explain: Store the copy when you first see a node, before visiting its neighbours, so cycles find it.
    hints:
      - What would you look up to know whether a node was seen?
  - id: ex-04
    legacyId: w8d2-4
    type: interview
    title: Keys and Rooms (LeetCode 841)
    q: 'There are n rooms; room 0 is unlocked. `rooms[i]` lists the keys found in room i (each key opens the room with that number). Return true if you can visit every room. Example: `[[1],[2],[3],[]]` → true; `[[1,3],[3,0,1],[2],[0]]` → false.'
    model:
      clarify: |
        - Keys are room numbers; rooms[i] is the adjacency list of i.
        - Directed: a key in room i to room j does not imply the reverse.
      brute: This is reachability; the brute force is already a traversal.
      optimize: Treat `rooms` as a directed adjacency list and run DFS or BFS from room 0, marking rooms visited when pushed. All rooms visited ⇔ the answer is true.
      edges: |
        - one room → true
        - a key to an already open room
        - a room that only an unreachable room unlocks
      complexity: 'O(V + E): rooms plus keys.'
    fn: canVisitAllRooms
    starter: |
      function canVisitAllRooms(rooms) {

      }
    solution: |
      function canVisitAllRooms(rooms) {
        const seen = new Array(rooms.length).fill(false);
        seen[0] = true; const st = [0]; let count = 1;
        while (st.length) {
          const u = st.pop();
          for (const v of rooms[u]) if (!seen[v]) { seen[v] = true; count++; st.push(v); }
        }
        return count === rooms.length;
      }
    tests:
      - args:
          - - - 1
            - - 2
            - - 3
            - []
        expect: true
      - args:
          - - - 1
              - 3
            - - 3
              - 0
              - 1
            - - 2
            - - 0
        expect: false
      - args:
          - - []
        expect: true
        hidden: true
      - args:
          - - - 2
            - []
            - - 1
        expect: true
        hidden: true
    explain: The input already is an adjacency list; recognising that is the whole problem.
    hints:
      - What graph do the rooms and keys form?
